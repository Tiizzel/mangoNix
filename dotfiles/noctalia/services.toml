# Noctalia Built-in Services Configuration
# Documentation: https://docs.noctalia.dev/noctalia/services/audio/

[audio]
enable_sounds = false
sound_volume = 0.5
enable_overdrive = false

[brightness]
minimum_brightness = 0.05
sync_all_monitors = false

[battery]
warning_threshold = 15

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 180.0

[nightlight]
temperature_day = 6500
temperature_night = 4000

[osd]
enabled = true
position = "bottom_center"
border = true
