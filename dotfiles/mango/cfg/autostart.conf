# | Autostart |
# Autostart applications and services
# Noctalia replaces standalone bars, launchers, notification daemons, wallpaper managers, and idle/lock managers.

# Start Noctalia Desktop Shell (Status bar, App launcher, Control Center, OSD, Wallpapers)
exec-once = noctalia

# Polkit authentication agent
exec-once = systemctl --user start polkit-gnome-authentication-agent-1

# Clipboard history & persistence
exec-once = wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once = wl-paste --type text --watch cliphist store

# Core applications
exec-once = zen-beta
exec-once = vesktop
exec-once = spotify

# Sync non-Noctalia components with wallpaper colors using Matugen
exec-once = matugen-apply
