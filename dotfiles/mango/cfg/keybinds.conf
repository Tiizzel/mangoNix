# | Keybinds |
# Documentation: https://mangowm.github.io/docs/bindings/keys
# Noctalia IPC: https://docs.noctalia.dev/noctalia/ipc/
# Filtered for installed applications and integrated with Noctalia shell services.

# ============= APPLICATIONS (INSTALLED ONLY) =============

# Launch Ghostty Terminal
bind = SUPER, t, spawn, ghostty

# Launch Zen Browser
bind = SUPER, b, spawn, zen-beta

# Open Thunar File Manager
bind = SUPER, f, spawn, thunar

# Launch Antigravity IDE
bind = SUPER, z, spawn, antigravity-ide

# Open Yazi File Manager in Ghostty
bind = SUPER, y, spawn, ghostty -e yazi

# Launch Kitty Terminal
bind = SUPER+SHIFT, t, spawn, kitty

# Audio Volume Control (pavucontrol)
bind = SUPER+ALT, m, spawn, pavucontrol

# ============= WINDOW MANAGEMENT =============

# Close Active Window
bind = SUPER, q, killclient,

# Force Close Window
bind = SUPER+SHIFT, q, killclient,

# Cycle Window Layout (Tiling / Master)
circle_layout=center_tile,scroller,dwindle
bind = SUPER+SHIFT, i, switch_layout,

# Toggle Fullscreen Mode
bind = SUPER+CTRL, f, togglefullscreen,

# Toggle Floating Mode
bind = SUPER+SHIFT, f, togglefloating,

# Toggle Maximize Window
bind = SUPER+SHIFT, m, togglemaximizescreen,

# ============= WINDOW NAVIGATION & FOCUS (ARROW KEYS) =============

# Focus Window Left
bind = SUPER, Left, focusdir, left

# Focus Window Right
bind = SUPER, Right, focusdir, right

# Focus Window Up
bind = SUPER, Up, focusdir, up

# Focus Window Down
bind = SUPER, Down, focusdir, down

# ============= WINDOW NAVIGATION & FOCUS (VI-STYLE) =============

# Focus Window Left (Vi-style)
bind = SUPER, h, focusdir, left

# Focus Window Right (Vi-style)
bind = SUPER, l, focusdir, right

# Focus Window Up (Vi-style)
bind = SUPER, k, focusdir, up

# Focus Window Down (Vi-style)
bind = SUPER, j, focusdir, down

# ============= WINDOW SWAPPING (ARROW KEYS) =============

# Swap Window Left
bind = SUPER+SHIFT, Left, exchange_client, left

# Swap Window Right
bind = SUPER+SHIFT, Right, exchange_client, right

# Swap Window Up
bind = SUPER+SHIFT, Up, exchange_client, up

# Swap Window Down
bind = SUPER+SHIFT, Down, exchange_client, down

# ============= WINDOW SWAPPING (VI-STYLE) =============

# Swap Window Left (Vi-style)
bind = SUPER+SHIFT, h, exchange_client, left

# Swap Window Right (Vi-style)
bind = SUPER+SHIFT, l, exchange_client, right

# Swap Window Up (Vi-style)
bind = SUPER+SHIFT, k, exchange_client, up

# Swap Window Down (Vi-style)
bind = SUPER+SHIFT, j, exchange_client, down

# ============= TAGS / WORKSPACES (1-9) =============

# Switch to Workspace 1
bind = SUPER, 1, view, 1, 0

# Switch to Workspace 2
bind = SUPER, 2, view, 2, 0

# Switch to Workspace 3
bind = SUPER, 3, view, 3, 0

# Switch to Workspace 4
bind = SUPER, 4, view, 4, 0

# Switch to Workspace 5
bind = SUPER, 5, view, 5, 0

# Switch to Workspace 6
bind = SUPER, 6, view, 6, 0

# Switch to Workspace 7
bind = SUPER, 7, view, 7, 0

# Switch to Workspace 8
bind = SUPER, 8, view, 8, 0

# Switch to Workspace 9
bind = SUPER, 9, view, 9, 0

# Move Window to Workspace 1
bind = SUPER+SHIFT, 1, tag, 1, 0

# Move Window to Workspace 2
bind = SUPER+SHIFT, 2, tag, 2, 0

# Move Window to Workspace 3
bind = SUPER+SHIFT, 3, tag, 3, 0

# Move Window to Workspace 4
bind = SUPER+SHIFT, 4, tag, 4, 0

# Move Window to Workspace 5
bind = SUPER+SHIFT, 5, tag, 5, 0

# Move Window to Workspace 6
bind = SUPER+SHIFT, 6, tag, 6, 0

# Move Window to Workspace 7
bind = SUPER+SHIFT, 7, tag, 7, 0

# Move Window to Workspace 8
bind = SUPER+SHIFT, 8, tag, 8, 0

# Move Window to Workspace 9
bind = SUPER+SHIFT, 9, tag, 9, 0

# Toggle View of Workspace 1
bind = SUPER+CTRL, 1, toggletag, 1, 0

# Toggle View of Workspace 2
bind = SUPER+CTRL, 2, toggletag, 2, 0

# Toggle View of Workspace 3
bind = SUPER+CTRL, 3, toggletag, 3, 0

# Toggle View of Workspace 4
bind = SUPER+CTRL, 4, toggletag, 4, 0

# Toggle View of Workspace 5
bind = SUPER+CTRL, 5, toggletag, 5, 0

# Toggle View of Workspace 6
bind = SUPER+CTRL, 6, toggletag, 6, 0

# Toggle View of Workspace 7
bind = SUPER+CTRL, 7, toggletag, 7, 0

# Toggle View of Workspace 8
bind = SUPER+CTRL, 8, toggletag, 8, 0

# Toggle View of Workspace 9
bind = SUPER+CTRL, 9, toggletag, 9, 0

# ============= WINDOW RESIZING & PROPORTIONS =============

# Shrink Window Width (-50px)
bind = SUPER+ALT, Left, resizewin, -50, 0

# Expand Window Width (+50px)
bind = SUPER+ALT, Right, resizewin, +50, 0

# Shrink Window Width (-50px, Vi-style)
bind = SUPER+ALT, h, resizewin, -50, 0

# Expand Window Width (+50px, Vi-style)
bind = SUPER+ALT, l, resizewin, +50, 0

# Previous Window Proportion Preset
bind = SUPER+CTRL, Left, switch_proportion_preset, prev

# Next Window Proportion Preset
bind = SUPER+CTRL, Right, switch_proportion_preset, next

# Previous Window Proportion Preset (Vi-style)
bind = SUPER+CTRL, h, switch_proportion_preset, prev

# Next Window Proportion Preset (Vi-style)
bind = SUPER+CTRL, l, switch_proportion_preset, next

# ============= SHELL BINDINGS (POWERED BY NOCTALIA IPC) =============

# Toggle Noctalia App Launcher
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher

# Toggle Noctalia App Launcher (Alternate)
bind = SUPER+SHIFT, Return, spawn, noctalia msg panel-toggle launcher

# Toggle Wallpaper Picker
bind = SUPER+SHIFT, w, spawn, noctalia msg panel-toggle wallpaper

# Wallhaven Wallpaper Browser
bind = SUPER+CTRL, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser

# Window Switcher Overlay
bind = SUPER, Tab, spawn, noctalia msg window-switcher

# Power & Session Menu
bind = SUPER, x, spawn, noctalia msg panel-toggle session

# Control Center: Network
bind = SUPER, c, spawn, noctalia msg panel-toggle control-center network

# Clipboard History Manager
bind = SUPER, v, spawn, noctalia msg panel-toggle clipboard

# Control Center: Calendar
bind = SUPER, m, spawn, noctalia msg panel-toggle control-center calendar

# Toggle Control Center
bind = SUPER+SHIFT, c, spawn, noctalia msg panel-toggle control-center

# Search Neovim Cheat Sheet: Super+, (Noctalia) | Ctrl+Super+, (Fuzzel Wide Modal)
bind = SUPER, comma, spawn, bash ~/.config/mango/scripts/show-neovim-cheatsheet.sh --noctalia
bind = SUPER+CTRL, comma, spawn, bash ~/.config/mango/scripts/show-neovim-cheatsheet.sh --fuzzel

# Search All Keybindings: Super+. (Noctalia) | Ctrl+Super+. (Fuzzel Wide Modal)
bind = SUPER, period, spawn, bash ~/.config/mango/scripts/show-keybinds.sh --noctalia
bind = SUPER+CTRL, period, spawn, bash ~/.config/mango/scripts/show-keybinds.sh --fuzzel

# Noctalia Settings Window (Alternate)
bind = SUPER+ALT, p, spawn, noctalia msg settings-toggle

# Noctalia Settings Window (Shift Alternate)
bind = SUPER+SHIFT, comma, spawn, noctalia msg settings-toggle

# Toggle Control Center (Alternate)
bind = SUPER+CTRL, r, spawn, noctalia msg panel-toggle control-center

# Toggle Desktop Dock
bind = SUPER, d, spawn, noctalia msg dock-toggle

# ============= ACTIONS & SCREENSHOTS (NOCTALIA IPC) =============

# Screenshot Selected Region
bind = SUPER, s, spawn, noctalia msg screenshot-region

# Screenshot Fullscreen
bind = SUPER+CTRL, s, spawn, noctalia msg screenshot-fullscreen

# Screenshot & Annotate
bind = SUPER+SHIFT, s, spawn, noctalia msg screenshot-annotate

# Screenshot & Annotate (Alternate)
bind = SUPER+ALT, s, spawn, noctalia msg screenshot-annotate

# Reload MangoWM Configuration
bind = SUPER+SHIFT, r, reload_config

# Lock Desktop Session
bind = SUPER+CTRL, l, spawn, noctalia msg session lock

# Toggle Night Light Mode
bind = SUPER+SHIFT, n, spawn, noctalia msg nightlight-force-toggle

# Apply Matugen Colors to Applications
bind = SUPER+ALT, t, spawn, matugen-apply

# ============= SPECIAL WORKSPACE / SCRATCHPAD =============

# Toggle Scratchpad Workspace
bind = SUPER, n, toggle_scratchpad

# Toggle Scratchpad Workspace (Alternate)
bind = SUPER+SHIFT, space, toggle_scratchpad

# ============= HARDWARE & MEDIA KEYS (NOCTALIA IPC) =============

# Brightness Up
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up

# Brightness Down
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# Mute Audio
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute

# Volume Up
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up

# Volume Down
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down

# Mute Microphone
bind = NONE, XF86AudioMicMute, spawn, noctalia msg mic-mute

# Toggle Media Playback
bind = NONE, XF86AudioPlay, spawn, noctalia msg media toggle

# Next Media Track
bind = NONE, XF86AudioNext, spawn, noctalia msg media next

# Previous Media Track
bind = NONE, XF86AudioPrev, spawn, noctalia msg media previous

# ============= MOUSE & AXIS BINDINGS =============
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize

# Mousewheel: Window cycling
axisbind = SUPER, UP, focusdir, left
axisbind = SUPER, DOWN, focusdir, right

# Mousewheel: Fine-grained resize
axisbind = SUPER+ALT, UP, resizewin, +50, 0
axisbind = SUPER+ALT, DOWN, resizewin, -50, 0

# Mousewheel: Cycle preset proportions
axisbind = SUPER+CTRL, UP, switch_proportion_preset, next
axisbind = SUPER+CTRL, DOWN, switch_proportion_preset, prev

# Mousewheel: Cycle preset proportions
axisbind = SUPER+SHIFT, UP,  switch_layout,
axisbind = SUPER+SHIFT, DOWN, switch_layout,
