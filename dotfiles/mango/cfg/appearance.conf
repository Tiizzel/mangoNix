# | Look & Feel |
# Documentation: https://mangowm.github.io/docs/visuals
# Noctalia Integration: https://docs.noctalia.dev/noctalia/compositor-settings/mango/

# Gaps and Borders
gappih = 4
gappiv = 4
gappoh = 8
gappov = 8
borderpx = 2

# Scratchpad geometry
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

# Opacity
focused_opacity = 1.0
unfocused_opacity = 1.0

# Cursor
cursor_size = 24

# Animations
animations = 1
layer_animations = 1
animation_type_open = zoom
animation_type_close = zoom
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.2
zoom_end_ratio = 0.8
fadein_begin_opacity = 0.3
fadeout_begin_opacity = 0.2
animation_duration_move = 300
animation_duration_open = 200
animation_duration_tag = 280
animation_duration_close = 250
animation_duration_focus = 0
animation_curve_open = 0.46, 1.0, 0.29, 1
animation_curve_move = 0.46, 1.0, 0.29, 1
animation_curve_tag = 0.46, 1.0, 0.29, 1
animation_curve_close = 0.08, 0.92, 0, 1
animation_curve_focus = 0.46, 1.0, 0.29, 1
animation_curve_opafadeout = 0.5, 0.5, 0.5, 0.5
animation_curve_opafadein = 0.46, 1.0, 0.29, 1

