# | Window & Layer Rules |
# Documentation: https://mangowm.github.io/docs/window-management/rules

# Steam rules
windowrule = isfloating:1, appid:[Ss]team
windowrule = isfloating:0, title:Steam
windowrule = isfloating:1, appid:steam, title:Steam Settings

# Floating Tools & Viewers
windowrule = isfloating:1, noswallow:1, title:Neovim Cheat Sheet
windowrule = isfloating:1, noswallow:1, width:960, height:640, title:WebApp Desktop Manager
windowrule = isfloating:1, noswallow:1, width:960, height:640, appid:webapp-manager
windowrule = isfloating:1, noswallow:1, width:850, height:520, appid:nix-search

# Terminal Swallowing
# Marks terminal emulators as 'isterm:1'. When a GUI application (e.g. editor, image viewer,
# or file manager) is launched from this terminal, MangoWM will swallow (temporarily hide)
# the terminal window and replace it in the layout, automatically restoring it once the child application exits.
windowrule = isterm:1, appid:com.mitchellh.ghostty
windowrule = isterm:1, appid:ghostty
windowrule = isterm:1, appid:kitty

# Layer rules
layerrule = noanim:1, layer_name:selection

# Opacity rules
windowrule = focused_opacity:1.0, unfocused_opacity:0.85, appid:^(.*)$
windowrule = focused_opacity:0.90, unfocused_opacity:0.85, appid:com.mitchellh.ghostty
windowrule = focused_opacity:0.95, unfocused_opacity:0.85, appid:kitty

# Browsers — always full opacity so videos/reading stay clear when unfocused
windowrule = focused_opacity:1.0, unfocused_opacity:1.0, appid:[Zz]en.*
windowrule = focused_opacity:1.0, unfocused_opacity:1.0, appid:[Ff]irefox.*
windowrule = focused_opacity:1.0, unfocused_opacity:1.0, appid:[Bb]rave.*

# Application Workspace Assignments
windowrule = tags:1|2|6, istagsilent:1, appid:[Zz]en.*
windowrule = tags:2|4, istagsilent:1, appid:[Ss]potify.*
windowrule = tags:2|4, istagsilent:1, appid:[Vv]esktop.*
