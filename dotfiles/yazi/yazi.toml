# Yazi Configuration File
# Documentation: https://yazi-rs.github.io/docs/configuration/overview

[mgr]
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1600
max_height = 1200
image_filter = "triangle"
image_quality = 80
sixel_fraction = 15

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix", desc = "Neovim" },
]

[open]
prepend_rules = [
  { name = "*/", use = [ "edit", "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "reveal" ] },
  { mime = "application/{json,javascript,x-javascript,xml,yaml,x-yaml,x-toml}", use = [ "edit", "reveal" ] },
  { mime = "application/{x-shellscript,x-python,x-perl,x-ruby}", use = [ "edit", "reveal" ] },
]

[input]
cursor_blink = false
