[General]
# SDDM Astronaut Theme (Purple Leaves Layout)
# Dynamically generated by Matugen with Noctalia Material colors

Font="JetBrainsMono Nerd Font"
FontSize=""
KeyboardSize="0.4"
RoundCorners="16"
Locale=""
