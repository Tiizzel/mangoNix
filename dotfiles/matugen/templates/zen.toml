# Oh-My-Posh theme dynamically colored by Matugen from wallpaper
console_title_template = '\{{ .Shell \}} in \{{ .Folder \}}'
version = 4
final_space = true

[palette]
  background = '{{colors.background.default.hex}}'
  surface = '{{colors.surface.default.hex}}'
  surface_variant = '{{colors.surface_variant.default.hex}}'
  surface_container = '{{colors.surface_container.default.hex}}'
  primary = '{{colors.primary.default.hex}}'
  on_primary = '{{colors.on_primary.default.hex}}'
  secondary = '{{colors.secondary.default.hex}}'
  on_secondary = '{{colors.on_secondary.default.hex}}'
  tertiary = '{{colors.tertiary.default.hex}}'
  on_tertiary = '{{colors.on_tertiary.default.hex}}'
  error = '{{colors.error.default.hex}}'
  outline = '{{colors.outline.default.hex}}'

[secondary_prompt]
  template = '<p:primary,transparent></><,p:primary> > </><p:primary,transparent></> '
  foreground = 'p:on_primary'
  background = 'transparent'

[transient_prompt]
  template = '<p:primary,transparent></><,p:primary> \{{ .Folder \}} </><p:primary,transparent></> '
  foreground = 'p:on_primary'
  background = 'transparent'

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = ' \{{ if .SSHSession \}} \{{ end \}}\{{ .UserName \}} '
    foreground = 'p:on_primary'
    background = 'p:primary'
    type = 'session'
    style = 'diamond'

  [[blocks.segments]]
    template = '  \{{ path .Path .Location \}} '
    foreground = 'p:on_secondary'
    powerline_symbol = ''
    background = 'p:secondary'
    type = 'path'
    style = 'powerline'

    [blocks.segments.options]
      style = 'folder'

  [[blocks.segments]]
    template = ' \{{ if .UpstreamURL \}}\{{ url .UpstreamIcon .UpstreamURL \}} \{{ end \}}\{{ .HEAD \}}\{{ if .BranchStatus \}} \{{ .BranchStatus \}}\{{ end \}}\{{ if .Working.Changed \}}  \{{ .Working.String \}}\{{ end \}}\{{ if .Staging.Changed \}}  \{{ .Staging.String \}}\{{ end \}} '
    foreground = 'p:on_tertiary'
    powerline_symbol = ''
    background = 'p:tertiary'
    type = 'git'
    style = 'powerline'

    [blocks.segments.options]
      branch_template = '\{{ trunc 25 .Branch \}}'
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    template = '  '
    foreground = 'p:on_primary'
    powerline_symbol = ''
    background = 'p:primary'
    type = 'root'
    style = 'powerline'

  [[blocks.segments]]
    leading_diamond = '<transparent,background></>'
    trailing_diamond = ''
    template = ' \{{ if gt .Code 0 \}} \{{ .Code \}}\{{ end \}}'
    foreground = 'p:on_primary'
    background = 'p:error'
    type = 'status'
    style = 'diamond'

[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    template = 'at <p:primary><b>\{{ .CurrentDate | date "15:04:05" \}}</b></>'
    foreground = 'p:primary'
    background = 'transparent'
    type = 'time'
    style = 'plain'
