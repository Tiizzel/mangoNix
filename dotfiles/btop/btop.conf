#? Config file for btop v.1.4+
# Clean and modern configuration matching terminal theme

#* Name of a btop theme ("Default", "TTY", or custom theme in themes/)
color_theme = "noctalia"

#* Theme background: False allows terminal background transparency to shine through
theme_background = False

#* True 24-bit color support
truecolor = True

#* Force TTY mode
force_tty = False

#* Presets for box layouts
disable_presets = "Off"
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default"

#* Vim keys (h, j, k, l) for directional navigation
vim_keys = True

#* Rounded corners on boxes
rounded_corners = True

#* Graph symbol: "braille", "block", "tty"
graph_symbol = "braille"

#* Update interval in milliseconds
update_ms = 1500

#* Processes sorting
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True
proc_info_smaps = False
proc_left = False
proc_filter_kernel = True

#* CPU box options
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
cpu_sensor = "Auto"
show_coretemp = True
cpu_core_map = ""
temp_scale = "celsius"
show_cpu_freq = True

#* Memory box options
mem_graphs = True
mem_below_net = False
zfs_arc_cached = True
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = True
zfs_hide_datasets = False
disk_free_priv = False
disks_filter = "exclude=/boot"

#* Net box options
net_broker = ""
net_sync = True
net_auto = True
net_unit = "bit"
net_invert = False
